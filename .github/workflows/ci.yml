name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Secret scan
        run: python scripts/secret_scan.py .

  windows-onboarding:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Run Windows onboarding regression tests
        run: >-
          python -m unittest
          tests.test_secure_files
          tests.test_encrypted_secret_store
          tests.test_cli.CliTest.test_start_guided_setup_imports_dotenv_and_prints_ready_summary
      - name: Secret scan
        run: python scripts/secret_scan.py .
