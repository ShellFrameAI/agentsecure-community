name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Secret scan
        run: python scripts/secret_scan.py .

  installed-package:
    name: Installed MCP regression tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and install wheel
        run: |
          python -m pip install build
          python -m build
          python -m pip install dist/*.whl
      - name: Test installed package outside the source checkout
        run: |
          mkdir -p "$RUNNER_TEMP/agentsecure-installed-tests"
          cp tests/test_mcp_security.py "$RUNNER_TEMP/agentsecure-installed-tests/"
          cd "$RUNNER_TEMP"
          python -c 'import agentsecure; print(agentsecure.__file__)'
          python -m unittest discover -s "$RUNNER_TEMP/agentsecure-installed-tests" -p 'test_mcp_security.py' -v
