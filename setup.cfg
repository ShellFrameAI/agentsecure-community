[metadata]
name = agentsecure
version = 0.1.11
description = Local-first security runtime for AI coding agents
long_description = file: README.md
long_description_content_type = text/markdown
author = ShellFrame AI
url = https://github.com/ShellFrameAI/agentsecure-community
license = Apache-2.0
project_urls =
    Source = https://github.com/ShellFrameAI/agentsecure-community
    Changelog = https://github.com/ShellFrameAI/agentsecure-community/blob/main/CHANGELOG.md
    Issues = https://github.com/ShellFrameAI/agentsecure-community/issues
classifiers =
    License :: OSI Approved :: Apache Software License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Topic :: Security
    Environment :: Console
    Operating System :: OS Independent

[options]
packages = find:
include_package_data = True
python_requires = >=3.8

[options.package_data]
agentsecure =
    config/*.json

[options.entry_points]
console_scripts =
    agentsecure = agentsecure.cli.main:main
